sonar.projectKey=frais-route
sonar.projectName=FraisRoute - Gestion des Indemnites Kilometriques & Frais de Route
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Sources & Tests
sonar.sources=backend/FraisRoute.Api,frontend/src
sonar.tests=backend/FraisRoute.Tests,frontend/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/bin/**,**/obj/**,**/wwwroot/**,**/*.db,**/*.spec.ts,**/*.test.ts,frontend/vite.config.ts,frontend/vitest.config.ts,frontend/capacitor.config.ts
sonar.test.inclusions=backend/FraisRoute.Tests/**/*.cs,frontend/tests/**/*.test.ts

# Couverture de code Backend (.NET / OpenCover) & Frontend (Vitest / LCOV)
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
